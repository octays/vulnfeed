[package]
name = "vulnfeed"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vulnfeed"
path = "src/bin/vulnfeed/main.rs"

[dependencies]
anstyle = "1.0.14"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
const_format = "0.2.37"
ctrlc = "3.5.2"
dashmap = "6.2.1"
error-stack = "0.6.0"
fastimer = "0.9.0"
gix-discover = "0.41.0"
jsonwebtoken = "9.3.1"
lazy_static = "1.5.1"
log = "0.4.34"
jiff = "0.2"
anyhow = "1"
logforth = { version = "0.27.0", features = [
    "colored",
    "layout-json",
    "append-fastrace",
    "append-rolling-file",
    "diagnostic-fastrace",
] }
mea = "0.4.2"
modql = { version = "0.4.1", features = ["with-sea-query"] }
nutype = { version = "0.6.2", features = ["serde"] }
pin-project = "1.1.13"
poem = { version = "3.1.12", features = ["static-files", "embed"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
sea-query = "0.32.7"
sea-query-binder = { version = "0.7.0", features = [
    "sqlx-sqlite",
    "with-time",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shadow-rs = "1.7.1"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "uuid",
    "migrate",
    "chrono",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-cron-scheduler = { version = "0.14.0", features = ["signal"] }
toml_edit = { version = "0.23.10", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
regex = "1.13.1"
scraper = { version = "0.24.0", features = ["atomic"] }
rquickjs = "0.9.0"
sha2 = "0.10.9"
tera = "1.20.1"
hmac = "0.12.1"
base64 = "0.22.1"
octocrab = "0.45.0"
zip = "5.1.1"
bytes = "1.12.1"

[build-dependencies]
build-data = "0.3.3"
gix-discover = "0.41.0"
sha2 = "0.10.9"
shadow-rs = "1.7.1"
